<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f6f6f4">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎱</text></svg>">
  <title>LuckyBall</title>
  <style>
    :root { color-scheme: light; --bg:#f6f6f4; --text:#242424; --muted:#777; --border:#dededb; --surface:#fff; --accent:#e8e8e5; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; -webkit-font-smoothing:antialiased; }
    button,input { font:inherit; }
    button { -webkit-tap-highlight-color:transparent; }
    .app { width:100%; min-height:100dvh; display:grid; place-items:center; padding:24px; }
    .hero { display:flex; justify-content:center; align-items:center; width:100%; }
    .ball-stage { position:relative; width:min(82vw,380px); aspect-ratio:1; }
    .ball { width:100%; height:100%; border-radius:50%; background:radial-gradient(circle at 34% 27%,#4a4a4a 0%,#181818 24%,#070707 62%,#000 100%); box-shadow:inset -22px -28px 50px rgba(0,0,0,.65),inset 14px 12px 25px rgba(255,255,255,.08),0 18px 36px rgba(0,0,0,.18); position:relative; border:0; cursor:pointer; touch-action:manipulation; display:block; }
    .ball:focus-visible, .corner-button:focus-visible, .action:focus-visible, input:focus-visible { outline:3px solid #757575; outline-offset:4px; }
    .ball:disabled { cursor:wait; }
    .window { position:absolute; width:47%; aspect-ratio:1; border-radius:50%; left:50%; top:50%; transform:translate(-50%,-50%); background:radial-gradient(circle at 45% 35%,#232323,#050505 72%); border:2px solid #303030; display:flex; align-items:center; justify-content:center; padding:18px; overflow:hidden; }
    .eight { font:700 clamp(62px,18vw,96px)/1 Georgia,serif; color:#f5f5f5; }
    .quote { color:#fff; font-size:clamp(13px,3.7vw,17px); line-height:1.35; text-align:center; font-weight:600; opacity:0; transform:scale(.88); transition:opacity .35s ease,transform .35s ease; overflow-wrap:anywhere; }
    .quote.show { opacity:1; transform:scale(1); }
    .loader { width:34px; height:34px; border-radius:50%; border:3px solid rgba(255,255,255,.2); border-top-color:#fff; animation:spin .8s linear infinite; }
    .hidden { display:none!important; }
    .shake { animation:shakeBall .65s ease-in-out; }
    @keyframes shakeBall { 0%,100%{transform:translate(0) rotate(0)} 15%{transform:translate(-8px,2px) rotate(-3deg)} 30%{transform:translate(7px,-4px) rotate(3deg)} 45%{transform:translate(-6px,-2px) rotate(-2deg)} 60%{transform:translate(7px,3px) rotate(2deg)} 75%{transform:translate(-3px,-3px) rotate(-1deg)} }
    @keyframes spin { to { transform:rotate(360deg); } }
    .corner-button { position:absolute; z-index:5; width:38px; height:38px; border-radius:50%; border:1px solid rgba(255,255,255,.22); background:rgba(20,20,20,.7); color:#fff; display:grid; place-items:center; padding:0; cursor:pointer; box-shadow:0 5px 14px rgba(0,0,0,.25); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); transition:background .2s ease,transform .2s ease; }
    .corner-button:hover { background:rgba(45,45,45,.82); }
    .corner-button:active { transform:scale(.94); }
    .corner-button:disabled { opacity:.45; cursor:wait; }
    .add-control { top:7%; right:7%; font-size:24px; line-height:1; }
    .reset-control { right:7%; bottom:7%; font-size:21px; line-height:1; }
    .composer { position:absolute; z-index:4; inset:18% 11%; display:flex; flex-direction:column; justify-content:center; gap:12px; padding:22px; border:1px solid rgba(255,255,255,.72); border-radius:24px; background:rgba(250,250,248,.94); box-shadow:0 18px 42px rgba(0,0,0,.34); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); }
    .composer-actions { display:flex; justify-content:flex-end; gap:8px; }
    input { width:100%; min-height:44px; border-radius:12px; border:1px solid var(--border); background:var(--surface); color:var(--text); padding:12px 16px; font-size:16px; }
    input::placeholder { color:#999; }
    .action { min-height:44px; border-radius:12px; padding:12px 20px; font-size:14px; font-weight:600; cursor:pointer; border:1px solid transparent; color:var(--text); }
    .action.primary { background:var(--accent); }
    .action.secondary { background:transparent; border-color:var(--border); }
    .action:hover { filter:brightness(.97); }
    .form-msg { min-height:20px; margin:0; font-size:13px; line-height:1.4; color:var(--muted); }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    @media(max-width:420px) { .app { padding:16px; } .ball-stage { width:min(90vw,360px); } .window { padding:12px; } .composer { inset:17% 9%; padding:18px; } .action { padding:11px 15px; } }
    @media(prefers-reduced-motion:reduce) { .shake { animation:none; } .quote,.corner-button { transition:none; } .loader { animation-duration:1.6s; } }
  </style>
</head>
<body>
  <main id="aaron-eightball" class="app">
    <section class="hero" aria-label="LuckyBall">
      <div class="ball-stage">
        <button id="ballBtn" type="button" class="ball" aria-label="Sacar una frase al azar">
          <span class="window">
            <span id="eight" class="eight">8</span>
            <span id="loader" class="loader hidden" role="status" aria-label="Cargando frase"></span>
            <span id="quote" class="quote hidden" aria-live="polite"></span>
          </span>
        </button>
        <button id="openFormBtn" type="button" class="corner-button add-control" aria-label="Agregar una frase" aria-controls="phraseForm" aria-expanded="false" title="Agregar una frase">+</button>
        <button id="resetBtn" type="button" class="corner-button reset-control" aria-label="Reiniciar ronda" title="Reiniciar ronda">↻</button>
        <form id="phraseForm" class="composer hidden" aria-label="Agregar una frase">
          <label class="sr-only" for="newPhrase">Nueva frase</label>
          <input id="newPhrase" type="text" maxlength="220" placeholder="Escribe una frase…" autocomplete="off">
          <p id="formMsg" class="form-msg" aria-live="polite"></p>
          <div class="composer-actions">
            <button id="cancelBtn" type="button" class="action secondary">Cancelar</button>
            <button id="saveBtn" type="submit" class="action primary">Guardar</button>
          </div>
        </form>
        <p id="liveStatus" class="sr-only" aria-live="polite"></p>
      </div>
    </section>
  </main>
  <script>
    (() => {
      const root = document.getElementById('aaron-eightball');
      if (!root || root.dataset.ready === '1') return;
      root.dataset.ready = '1';

      // Sustituye este valor después de desplegar Code.gs como aplicación web.
      const API_URL = 'https://script.google.com/macros/s/AKfycbx9lgXltg4HmewI4nAp3qo8IbNe6dozJteCDRI33bI6XIpK90l6Lcf2r5yEe-O0L7LUpw/exec';
      const API_TIMEOUT_MS = 20000;
      let busy = false;

      const ball = root.querySelector('#ballBtn');
      const eight = root.querySelector('#eight');
      const loader = root.querySelector('#loader');
      const quote = root.querySelector('#quote');
      const input = root.querySelector('#newPhrase');
      const openForm = root.querySelector('#openFormBtn');
      const form = root.querySelector('#phraseForm');
      const save = root.querySelector('#saveBtn');
      const cancel = root.querySelector('#cancelBtn');
      const reset = root.querySelector('#resetBtn');
      const msg = root.querySelector('#formMsg');
      const liveStatus = root.querySelector('#liveStatus');

      function isConfigured() {
        return API_URL.startsWith('https://script.google.com/macros/s/') && API_URL.endsWith('/exec');
      }

      function isAppsScriptOrigin(origin) {
        try {
          const url = new URL(origin);
          return url.protocol === 'https:' &&
            (url.hostname === 'script.google.com' || url.hostname.endsWith('.googleusercontent.com'));
        } catch {
          return false;
        }
      }

      function api(action, values = {}) {
        if (!isConfigured()) {
          return Promise.reject(new Error('Falta configurar la URL de Apps Script en index.html.'));
        }

        return new Promise((resolve, reject) => {
          const requestId = crypto.randomUUID ? crypto.randomUUID() :
            Date.now().toString(36) + Math.random().toString(36).slice(2);
          const frame = document.createElement('iframe');
          const form = document.createElement('form');
          const field = document.createElement('input');
          const frameName = 'luckyball_' + requestId.replace(/[^a-z0-9]/gi, '');

          frame.name = frameName;
          frame.hidden = true;
          form.hidden = true;
          form.method = 'POST';
          form.action = API_URL;
          form.target = frameName;
          field.type = 'hidden';
          field.name = 'payload';
          field.value = JSON.stringify({
            action,
            requestId,
            origin: window.location.origin,
            ...values
          });
          form.appendChild(field);

          const cleanup = () => {
            clearTimeout(timer);
            window.removeEventListener('message', onMessage);
            form.remove();
            frame.remove();
          };
          const onMessage = event => {
            if (!isAppsScriptOrigin(event.origin)) return;
            const response = event.data;
            if (!response || response.requestId !== requestId) return;
            cleanup();
            if (response.ok) resolve(response.data);
            else reject(new Error(response.error?.message || 'No se pudo completar la operación.'));
          };
          const timer = setTimeout(() => {
            cleanup();
            reject(new Error('La respuesta tardó demasiado. Intenta de nuevo.'));
          }, API_TIMEOUT_MS);

          window.addEventListener('message', onMessage);
          document.body.append(frame, form);
          form.submit();
        });
      }

      function setBusy(value) {
        busy = value;
        ball.disabled = value;
        openForm.disabled = value;
        save.disabled = value;
        cancel.disabled = value;
        reset.disabled = value;
        input.disabled = value;
      }

      function update(data) {
        const state = data.stats || data;
        const remaining = state.available + ' ' +
          (state.available === 1 ? 'frase restante' : 'frases restantes') +
          ' en esta ronda';
        ball.setAttribute('aria-label', 'Sacar una frase al azar. ' + remaining + '.');
        liveStatus.textContent = remaining;
      }

      function openComposer() {
        if (busy) return;
        form.classList.remove('hidden');
        openForm.setAttribute('aria-expanded', 'true');
        msg.textContent = '';
        requestAnimationFrame(() => input.focus());
      }

      function closeComposer() {
        form.classList.add('hidden');
        openForm.setAttribute('aria-expanded', 'false');
        input.value = '';
        msg.textContent = '';
        openForm.focus();
      }

      async function loadState() {
        try {
          setBusy(true);
          const state = await api('state');
          update(state);
        } catch (error) {
          liveStatus.textContent = error.message;
        } finally {
          setBusy(false);
        }
      }

      async function draw() {
        if (busy) return;
        setBusy(true);
        msg.textContent = '';
        quote.classList.remove('show');
        quote.classList.add('hidden');
        eight.classList.add('hidden');
        loader.classList.remove('hidden');
        ball.classList.remove('shake');
        void ball.offsetWidth;
        ball.classList.add('shake');

        try {
          const [result] = await Promise.all([
            api('draw'),
            new Promise(resolve => setTimeout(resolve, 650))
          ]);
          loader.classList.add('hidden');
          quote.textContent = '“' + result.phrase.text + '”';
          quote.classList.remove('hidden');
          requestAnimationFrame(() => quote.classList.add('show'));
          update(result);
        } catch (error) {
          loader.classList.add('hidden');
          eight.classList.remove('hidden');
          liveStatus.textContent = error.message;
        } finally {
          setBusy(false);
        }
      }

      async function addPhrase() {
        if (busy) return;
        const text = input.value.trim().replace(/\s+/g, ' ');
        if (!text) {
          msg.textContent = 'Escribe una frase primero.';
          input.focus();
          return;
        }
        if (text.length > 220) {
          msg.textContent = 'La frase es demasiado larga.';
          return;
        }

        try {
          setBusy(true);
          const result = await api('add', { text });
          update(result);
          closeComposer();
          liveStatus.textContent = 'Frase guardada.';
        } catch (error) {
          msg.textContent = error.message;
        } finally {
          setBusy(false);
          if (form.classList.contains('hidden')) openForm.focus();
          else input.focus();
        }
      }

      async function resetRound() {
        if (busy) return;
        try {
          setBusy(true);
          const result = await api('reset');
          eight.classList.remove('hidden');
          loader.classList.add('hidden');
          quote.classList.add('hidden');
          quote.classList.remove('show');
          quote.textContent = '';
          update(result);
          liveStatus.textContent = 'Ronda reiniciada.';
        } catch (error) {
          liveStatus.textContent = error.message;
        } finally {
          setBusy(false);
        }
      }

      ball.addEventListener('click', draw);
      openForm.addEventListener('click', openComposer);
      cancel.addEventListener('click', closeComposer);
      form.addEventListener('submit', event => {
        event.preventDefault();
        addPhrase();
      });
      reset.addEventListener('click', resetRound);
      document.addEventListener('keydown', event => {
        if (event.key === 'Escape' && !form.classList.contains('hidden') && !busy) closeComposer();
      });

      loadState();
    })();
  </script>
</body>
</html>
